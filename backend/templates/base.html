<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>{% block title %}HTML Planner{% endblock %}</title>
  <style>
    :root {
      --ink: #0a0a0a;
      --paper: #f4f4f1;
      --surface: #ffffff;
      --panel: #e8e8e4;
      --line: #0a0a0a;
      --muted: #5f5f5a;
      --quiet: #888882;
      --accent: #d8ff3e;
      --warning: #c99100;
      --danger: #b42318;
      --radius: 10px;
      --z-dropdown: 20;
      --z-sticky: 30;
      --z-modal-backdrop: 40;
      --z-modal: 50;
      --z-toast: 60;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Arial", "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    ::selection { background: var(--accent); color: var(--ink); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--panel); }
    ::-webkit-scrollbar-thumb { background: var(--ink); border: 3px solid var(--panel); border-radius: 8px; }

    .encase-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .encase-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
