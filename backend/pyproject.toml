[project]
name = "backend"
version = "0.1.0"
description = "HTML Plan Service Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",
    "tortoise-orm>=0.25.0,<1.0.0",
    "uvicorn>=0.30.0",
    "aiosqlite>=0.20.0",
    "aerich>=0.8.1",
    "pyyaml>=6.0.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routes", "backends", "services"]

[tool.tortoise]
tortoise_orm = "tortoise_conf.TORTOISE_ORM"
